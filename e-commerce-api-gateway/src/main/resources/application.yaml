server:
  port: 8080

spring:
  application:
    name: api-gateway

  # ---- Pull config from config-server ----
  config:
    import: optional:configserver:http://${CONFIG_USER:config-user}:${CONFIG_PASSWORD:config-pass}@${CONFIG_HOST:localhost}:${CONFIG_PORT:8888}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:native}

  # ---- Reactive Redis for rate limiting ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
        pool:
          max-connections: 500
          max-idle-time: 30s
      metrics:
        enabled: true
      # Prevent duplicate CORS headers — we configure CORS in Java
      globalcors:
        add-to-simple-url-handler-mapping: true